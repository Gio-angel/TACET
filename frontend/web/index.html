<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TACET</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="top-toggles">
      <button class="toggle-btn" id="textToggle" title="Show transcript">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="toggle-btn" id="saveToggle" title="Save transcripts to CSV">⤓</button>
    </div>

    <div class="dev" id="dev" title="BERT encodes">BERT <b id="devCount">0</b> · P <b id="devProb">0.00</b></div>

    <main class="stage">
      <div class="orb" id="orb"></div>
      <div class="transcript" id="transcript"></div>
      <div class="loader" id="loader"></div>
      <p class="hint" id="hint">Tap the mic to start</p>
    </main>

    <footer class="dock">
      <div class="select">
        <select id="llm">
          <option>ChatGPT</option>
          <option>Claude</option>
          <option>Gemini</option>
        </select>
      </div>
      <button class="mic" id="micBtn" aria-label="Microphone">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        <span class="spinner"></span>
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
